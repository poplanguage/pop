name: Coverage

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview

      - name: Cache LLVM 22 packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-llvm-22-apt

      - name: Install LLVM 22
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22

      - name: Export LLVM 22
        shell: bash
        run: |
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache coverage target
        uses: actions/cache@v4
        with:
          path: target/llvm-cov-target
          key: ${{ runner.os }}-rust-1.96-llvmcov-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96-llvmcov-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-rust-1.96-llvmcov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Remove old coverage profiles
        shell: bash
        run: |
          find target/llvm-cov-target -type f -name '*.profraw' -delete 2>/dev/null || true
          find target/llvm-cov-target -type f -name '*.profdata' -delete 2>/dev/null || true
          rm -f codecov.json

      - name: Run tests with coverage
        shell: bash
        run: |
          timeout \
            --signal=TERM \
            --kill-after=30s \
            30m \
            cargo llvm-cov \
              --no-report \
              --no-fail-fast \
              --workspace \
              --all-features \
              --lib \
              --bins \
              --tests \
              --examples \
              -- \
              --test-threads=1 \
          || true

      - name: Remove empty coverage profiles
        if: always()
        shell: bash
        run: |
          find target/llvm-cov-target -type f -name '*.profraw' -size 0 -delete 2>/dev/null || true

      - name: Generate Codecov report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cargo llvm-cov report \
            --codecov \
            --failure-mode all \
            --output-path codecov.json

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('codecov.json') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: true
          use_oidc: true
